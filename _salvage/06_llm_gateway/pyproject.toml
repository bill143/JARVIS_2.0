[project]
name = "echo-litellm"
version = "0.1.0"
description = "LiteLLM proxy for the JARVIS/NEXUS-EST stack"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }
authors = [
    { name = "Bill Asmar", email = "bill@oneillcontractors.com" }
]

dependencies = [
    # Core proxy
    "litellm[proxy]>=1.58.0,<2.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",

    # Observability
    "langfuse>=2.55,<3.0",

    # Config + validation
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "pyyaml>=6.0,<7.0",

    # Runtime
    "python-dotenv>=1.0,<2.0",
    "asyncpg>=0.29,<1.0",

    # Provider SDKs (LiteLLM imports these dynamically but we pin)
    "anthropic>=0.45.0",
    "openai>=1.60.0",
    "google-genai>=0.3.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.25.2",
    "pytest-cov==6.0.0",
    "ruff==0.9.3",
    "mypy==1.14.1",
    "pytest-httpx>=0.35",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "S", "SIM"]
ignore = ["E501"]  # handled by formatter

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]